services:
  # O motor de email Stalwart
  zimamail-server:
    image: stalwartlabs/mail-server:latest
    container_name: zimamail-server
    restart: always
    ports:
      - "25:25"     # Essencial: Receber emails de fora
      - "587:587"   # Essencial: Enviar emails (SMTP Seguro)
      - "993:993"   # Essencial: Ler emails (IMAP Seguro/Celular)
      - "8080:8080" # Painel de Controle Stalwart
    environment:
      - STALWART_DATABASE_URL=postgresql://postgres:${SUPABASE_DB_PASSWORD}@${SUPABASE_DB_HOST}:5432/postgres
    volumes:
      - /DATA/AppData/zimamail/server/data:/opt/stalwart-mail/data
      - /DATA/AppData/zimamail/server/config:/opt/stalwart-mail/etc

  # Seu Dashboard Profissional
  zimamail-dashboard:
    image: werikoliveira/email:latest
    container_name: zimamail-dashboard
    restart: always
    ports:
      - "3080:3000"
    environment:
      - VITE_SUPABASE_URL=${SUPABASE_URL}
      - VITE_SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}
      - NODE_ENV=production
    volumes:
      - /DATA/AppData/zimamail/dashboard/data:/app/data
